name: Deploy interactive backplane to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
      timezone: 'Europe/Istanbul'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh contribution matrix
        run: npm run generate:contributions
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_CONTRIBUTIONS_TOKEN }}
          GITHUB_USERNAME: utkucaglar
      - name: Upload backplane artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: backplane
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
